<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Assembly Preview</title>
  <style>
    :root {
      --bg: #0C0E11;
      --text: #ECEEF1;
      --border: #262B33;
      --link: #F5A524;
    }
    body.light {
      --bg: #F5F3EE;
      --text: #13161B;
      --border: #D8D3C8;
      --link: #B45309;
    }
    body {
      margin: 0;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }
    .markdown-body {
      max-width: 980px;
      margin: 0 auto;
    }
    picture, img {
      display: block;
      width: 100%;
      height: auto;
      margin-bottom: 24px;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
      font-size: 13px;
      font-family: monospace;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 10px 14px;
      text-align: left;
    }
    th {
      background: rgba(255, 255, 255, 0.04);
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }
  </style>
</head>
