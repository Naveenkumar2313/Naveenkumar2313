<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
<title id="title">dashboard.svg</title><desc id="desc">A project dashboard featuring Codorythm, Robot Brain and a system design learning platform.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#151b34"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
 .muted{fill:#aab5ce}.white{fill:#f8fafc}.blueText{fill:#93c5fd}.coralText{fill:#fda4af}
 .eyebrow{font-size:16px;font-weight:700;letter-spacing:3px}.heading{font-size:42px;font-weight:750;letter-spacing:-1.2px}.body{font-size:20px}.small{font-size:15px}
 .panel{fill:#ffffff;fill-opacity:.045;stroke:#9db5e8;stroke-opacity:.18;stroke-width:1.4}
 .float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out infinite reverse}
 .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="410" rx="30" fill="url(#bg)"/>
<circle cx="1060" cy="80" r="190" fill="#2563eb" opacity=".18" filter="url(#glow)"/>
<circle cx="80" cy="390" r="150" fill="#f97366" opacity=".10" filter="url(#glow)"/>
<text x="70" y="78" class="eyebrow coralText">03 / BUILDER LOG</text><text x="70" y="136" class="heading white">Things I'm shaping</text>
<rect x="70" y="175" width="330" height="170" rx="20" class="panel"/><text x="98" y="220" class="blueText" font-size="17" font-weight="700">01 — LEARNING PLATFORMS</text><text x="98" y="270" class="white" font-size="30" font-weight="750">Codorythm</text><text x="98" y="307" class="muted small">DSA practice · virtual labs · progress</text>
<rect x="435" y="175" width="330" height="170" rx="20" class="panel"/><text x="463" y="220" class="coralText" font-size="17" font-weight="700">02 — ROBOTICS</text><text x="463" y="270" class="white" font-size="30" font-weight="750">Robot Brain</text><text x="463" y="307" class="muted small">Interactive assistant · Raspberry Pi</text>
<rect x="800" y="175" width="330" height="170" rx="20" class="panel"/><text x="828" y="220" class="blueText" font-size="17" font-weight="700">03 — SYSTEMS</text><text x="828" y="270" class="white" font-size="30" font-weight="750">System Design</text><text x="828" y="307" class="muted small">Components · trade-offs · simulation</text>
<text x="72" y="385" class="muted small">STATUS  /  ITERATING IN PUBLIC  ·  DETAILS AND METRICS KEPT IN THE PROJECT REPOSITORIES</text></svg>