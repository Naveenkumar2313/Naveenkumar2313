<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">hero.svg</title><desc id="desc">Naveen Kumar K, software developer focused on full-stack products, educational technology and robotics.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#151b34"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#f97316"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<style>
 text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
 .muted{fill:#aab5ce}.white{fill:#f8fafc}.blueText{fill:#93c5fd}.coralText{fill:#fda4af}
 .eyebrow{font-size:16px;font-weight:700;letter-spacing:3px}.heading{font-size:42px;font-weight:750;letter-spacing:-1.2px}.body{font-size:20px}.small{font-size:15px}
 .panel{fill:#ffffff;fill-opacity:.045;stroke:#9db5e8;stroke-opacity:.18;stroke-width:1.4}
 .float{animation:float 6s ease-in-out infinite}.float2{animation:float 7s ease-in-out infinite reverse}
 .pulse{animation:pulse 4s ease-in-out infinite;transform-origin:center}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
 @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<circle cx="1060" cy="80" r="190" fill="#2563eb" opacity=".18" filter="url(#glow)"/>
<circle cx="80" cy="540" r="150" fill="#f97366" opacity=".10" filter="url(#glow)"/>
<rect x="48" y="48" width="1104" height="464" rx="26" class="panel"/>
<g class="float"><circle cx="950" cy="275" r="135" fill="url(#blue)" opacity=".13"/><circle cx="950" cy="275" r="104" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5 10"/><circle cx="950" cy="275" r="76" fill="#172747" stroke="#5b8fe8" stroke-opacity=".55"/><path d="M900 280l32 32 70-82" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1035" cy="185" r="11" fill="#fb7185"/><circle cx="850" cy="365" r="8" fill="#60a5fa"/></g>
<text x="92" y="126" class="eyebrow blueText">HELLO, WORLD — I'M</text>
<text x="88" y="218" class="white" font-size="68" font-weight="800" letter-spacing="-2">NAVEEN KUMAR K</text>
<text x="92" y="274" class="coralText" font-size="27" font-weight="650">Software Developer · Full-Stack · Robotics</text>
<text x="92" y="338" class="muted body">I build practical software, interactive learning experiences</text>
<text x="92" y="370" class="muted body">and connected things that bridge code with the real world.</text>
<rect x="92" y="416" width="190" height="44" rx="22" fill="url(#blue)"/><text x="187" y="444" text-anchor="middle" class="white small" font-weight="700">BUILD • LEARN • REPEAT</text>
<text x="1090" y="470" text-anchor="end" class="muted small">BENGALURU, INDIA</text></svg>